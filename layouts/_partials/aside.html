<aside class="sidebar">
  <h2>{{ .title }}</h2>
  <div class="sidebar-groups">
    {{ range .groups }}
    <section class="sidebar-group">
      <h3>{{ .title }}</h3>
      <div class="sidebar-group-body prose">
        {{ with .description }}<p>{{ . | markdownify }}</p>{{ end }}
        {{ with .items }}
        <ul>{{ range . }}<li>{{ . | markdownify }}</li>{{ end }}</ul>
        {{ end }}
      </div>
    </section>
    {{ end }}
  </div>
</aside>
