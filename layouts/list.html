{{ define "main" }}
<div class="listing">
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <ul class="page-list">
    {{ range .RegularPages }}
    <li class="leader-row">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
