{{ define "main" }}
<div class="feed">
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}

  {{ range .Pages }}
  <article class="prose">
    <h3>
      <time datetime="{{ .Date }}" class="drop-date">{{ .Date.Format "January 2, 2006" }}</time>
    </h3>
    {{ .Content }}
  </article>
  {{ end }}
</div>
{{ end }}
